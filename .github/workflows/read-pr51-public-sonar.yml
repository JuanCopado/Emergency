name: Read public Sonar PR51 metadata
on:
  push:
    branches: ['diagnostic/sonar-pr51-public-findings-20261121']
    paths: ['.github/workflows/read-pr51-public-sonar.yml']
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read bounded public metadata for PR51
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --get https://sonarcloud.io/api/issues/search \
            --data-urlencode 'organization=juancopado' --data-urlencode 'componentKeys=JuanCopado_Emergency' \
            --data-urlencode 'pullRequest=51' --data-urlencode 'resolved=false' --data-urlencode 'ps=100' \
            | jq -ce '{total, issues: [.issues[] | {rule,type,severity,impacts,component,line,message: ((.message // "")[:300])}]}'
      - name: Read public PR51 per-file coverage metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --get https://sonarcloud.io/api/measures/component_tree \
            --data-urlencode 'component=JuanCopado_Emergency' --data-urlencode 'pullRequest=51' \
            --data-urlencode 'metricKeys=new_lines_to_cover,new_uncovered_lines,new_conditions_to_cover,new_uncovered_conditions' \
            --data-urlencode 'qualifiers=FIL' --data-urlencode 'ps=500' \
            | jq -ce '{total:.paging.total,files:[.components[] | {path, measures:[.measures[]? | {metric,value:(.period.value // .periods[0].value // .value)}]} | select(any(.measures[]; (.metric=="new_uncovered_lines" or .metric=="new_uncovered_conditions") and ((.value|tonumber?)>0)))]}'
