name: Read public Sonar PR51 metadata
on:
  push:
    branches: ['diagnostic/sonar-pr51-public-findings-20261121']
    paths: ['.github/workflows/read-pr51-public-sonar.yml']
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read bounded public metadata for PR51
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --get https://sonarcloud.io/api/issues/search \
            --data-urlencode 'organization=juancopado' --data-urlencode 'componentKeys=JuanCopado_Emergency' \
            --data-urlencode 'pullRequest=51' --data-urlencode 'resolved=false' --data-urlencode 'ps=100' \
            | jq -ce '{total, issues: [.issues[] | {rule,type,severity,impacts,component,line}]}'
      - name: Read public GitHub check annotations of audited commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://api.github.com/repos/JuanCopado/Emergency'
          run=$(curl -fsS --max-time 20 "$endpoint/commits/8788395d7d337dec4a44af266188506171f416fd/check-runs?per_page=100" | jq -er '[.check_runs[] | select(.app.slug == "sonarqubecloud" or .app.slug == "sonarcloud")] | max_by(.id).id')
          echo "public_check=$run"
          curl -fsS --max-time 20 "$endpoint/check-runs/$run/annotations?per_page=100" \
            | jq -ce '[.[] | {path,start_line,end_line,annotation_level,title,message: ((.message // "")[:220])}]'
