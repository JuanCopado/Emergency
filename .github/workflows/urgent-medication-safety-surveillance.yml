name: Urgent medication safety surveillance
on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
permissions:
  contents: read
  actions: read
jobs:
  urgent-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore previous urgent surveillance state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .surveillance-previous
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=urgent-medication-safety-report&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id/zip" > /tmp/previous.zip
            python - <<'PY'
          import zipfile
          with zipfile.ZipFile("/tmp/previous.zip") as z:
              names=[n for n in z.namelist() if n.endswith("evidence-surveillance-report.json")]
              if names:
                  with z.open(names[0]) as src, open(".surveillance-previous/previous.json","wb") as dst:
                      dst.write(src.read())
          PY
          fi
      - name: Discover authoritative source changes
        run: |
          args=()
          if [ -f .surveillance-previous/previous.json ]; then args+=(--previous .surveillance-previous/previous.json); fi
          python clinical/scripts/evidence_surveillance.py "${args[@]}" --cadence urgent --output evidence-surveillance-report.json
      - name: Build urgent review queue
        if: always()
        run: |
          if [ -f evidence-surveillance-report.json ]; then
            python clinical/scripts/urgent_safety_triage.py evidence-surveillance-report.json --output urgent-safety-report.json
          fi
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urgent-medication-safety-report
          path: |
            evidence-surveillance-report.json
            urgent-safety-report.json
          if-no-files-found: error
          retention-days: 30
