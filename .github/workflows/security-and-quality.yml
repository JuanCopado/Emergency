name: Security and quality

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**', 'v1.*']
  workflow_dispatch:
  schedule:
    # GitHub executes schedules from the default branch only.
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  # Share a group for a branch's push and PR; cancel obsolete duplicate work.
  group: security-quality-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test report privacy and failure propagation
        run: python3 -m unittest discover -s security/tests -p 'test_*.py'
      - name: Test local security rules
        env:
          SEMGREP_IMAGE: docker.io/semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
        run: |
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e XDG_CONFIG_HOME=/tmp -e XDG_CACHE_HOME=/tmp \
            -e SEMGREP_SEND_METRICS=off -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE" \
            semgrep --test --config security/rules security/tests --metrics off --disable-version-check
      - name: Scan with Semgrep 1.185.0
        id: scan
        env:
          SEMGREP_IMAGE: docker.io/semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e XDG_CONFIG_HOME=/tmp -e XDG_CACHE_HOME=/tmp \
            -e SEMGREP_SEND_METRICS=off -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/security:/reports" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config security/rules --metrics off --disable-version-check \
            --strict --error --quiet --json --output /reports/semgrep.raw.json .
      - name: Classify and enforce Semgrep findings
        if: always() && steps.scan.outcome != 'skipped'
        run: >-
          python3 scripts/security/report.py semgrep
          --check
          --require-target app/src/main.tsx
          --require-target clinical/scripts/clinical_note_api.py
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/semgrep.summary.json
          if-no-files-found: error
          retention-days: 7

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Scan with Trivy 0.76.2
        id: scan
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p "$RUNNER_TEMP/security" "$RUNNER_TEMP/trivy-cache"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/security:/reports" \
            -v "$RUNNER_TEMP/trivy-cache:/cache" -w /src "$TRIVY_IMAGE" \
            fs --config security/trivy.yaml --scanners vuln,secret,misconfig \
            --disable-telemetry --skip-version-check --ignore-unfixed=false --include-dev-deps \
            --cache-dir /cache --format json --output /reports/trivy.raw.json --exit-code 0 --timeout 12m .
      - name: Classify and enforce Trivy findings
        if: always() && steps.scan.outcome != 'skipped'
        # Scan all severities for visibility; block HIGH/CRITICAL and every secret.
        run: >-
          python3 scripts/security/report.py trivy
          --check
          --require-target app/package-lock.json
          --require-target clinical/requirements.txt
          --require-target clinical/requirements-test.txt
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/trivy.summary.json
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: sonarqube
    # No needs: a vulnerability-only Trivy failure must not cancel this analysis.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Determine whether secrets may be used
        id: trust
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if { [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; } \
            || [ "$ACTOR" = 'dependabot[bot]' ] || [ "$TRIGGERING_ACTOR" = 'dependabot[bot]' ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Sonar analysis OMITTED: fork or Dependabot event; no secret supplied.'
            echo '### SonarQube: OMITTED (untrusted PR or Dependabot); no analysis or quality gate result.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require configured Sonar credential
        if: steps.trust.outputs.eligible == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Sonar CONFIGURATION_ERROR: repository Actions secret SONAR_TOKEN is missing.'
            echo '### SonarQube: CONFIGURATION_ERROR; SONAR_TOKEN missing. Scan and quality gate NOT EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Checkout complete history
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12 for coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node 22 for coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Measure Python test coverage
        if: steps.trust.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r clinical/requirements-test.txt coverage==7.17.3
          mkdir -p coverage
          python3 -m coverage erase
          python3 -m coverage run --parallel-mode --branch --source=clinical/scripts,clinical/qa,clinical/agents,scripts \
            -m unittest discover -s clinical/tests -p 'test_*.py' -q
          python3 -m coverage run --parallel-mode --branch --source=clinical/scripts,clinical/qa,clinical/agents,scripts \
            -m unittest discover -s security/tests -p 'test_*.py' -q
          python3 -m coverage combine
          python3 -m coverage xml -o coverage/python.xml
          test -s coverage/python.xml
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          file=Path('coverage/python.xml')
          root=ElementTree.parse(file).getroot()
          classes=root.findall('.//class')
          if not classes or not any(float(c.get('line-rate', '0'))>0 for c in classes):
              raise SystemExit('Python coverage must contain measured executed source')
          print('Measured Python coverage classes:', len(classes),
                'line-rate:', root.attrib.get('line-rate'))
          PY
      - name: Measure frontend coverage and normalize paths
        if: steps.trust.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          cd app
          npm ci --no-audit --no-fund
          npm test -- --coverage.enabled --coverage.provider=v8 \
            --coverage.reporter=lcov --coverage.reporter=text-summary \
            --coverage.include='src/**/*.{ts,tsx,js,jsx}' \
            --coverage.include='scripts/**/*.{ts,tsx,js,mjs,cjs}' \
            --coverage.exclude='src/test/**' \
            --coverage.exclude='**/*.test.{ts,tsx,js,jsx}' \
            --coverage.exclude='**/*.node-test.mjs'
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          root=Path.cwd().resolve()
          app=root/'app'
          path=app/'coverage'/'lcov.info'
          original=path.read_text()
          lines=[]
          count=0
          for line in original.splitlines():
              if line.startswith('SF:'):
                  name=line[3:]
                  source=Path(name)
                  absolute=source.resolve() if source.is_absolute() else (app/source).resolve()
                  if not absolute.is_relative_to(app) or not absolute.is_file():
                      raise SystemExit('LCOV source outside app or missing')
                  line='SF:'+absolute.relative_to(root).as_posix()
                  count+=1
              lines.append(line)
          if count==0 or not any(x.startswith('DA:') for x in lines):
              raise SystemExit('LCOV has no measured source statements')
          path.write_text('\n'.join(lines)+'\n')
          print('LCOV files with normalized repository-root paths:',count)
          PY
      - name: Confirm coverage reports exist before scanning
        if: steps.trust.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          test -s app/coverage/lcov.info
          test -s coverage/python.xml
          echo 'Real LCOV and Cobertura XML verified; no coverage threshold weakened.'
      - name: Scan and wait for quality gate
        id: sonar
        if: steps.trust.outputs.eligible == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.scanner.autoconfig.enabled=false
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Record observed scan outcome
        if: always() && steps.trust.outputs.eligible == 'true'
        env:
          SCAN_OUTCOME: ${{ steps.sonar.outcome }}
        run: |
          {
            echo '### SonarQube Cloud'
            echo "Scanner step outcome: **$SCAN_OUTCOME**."
            echo 'A failed step may indicate configuration, plan limits, scanner errors or a failed quality gate; inspect its logs.'
            echo 'A skipped scan is NOT EXECUTED. Technical analysis does not change CLINICALLY_PENDING.'
            echo 'https://sonarcloud.io/dashboard?id=JuanCopado_Emergency'
          } >> "$GITHUB_STEP_SUMMARY"
