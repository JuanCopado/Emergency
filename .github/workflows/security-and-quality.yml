name: Security and quality

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**', 'v1.*']
  workflow_dispatch:
  schedule:
    # GitHub executes schedules from the default branch only.
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  # Preserve both branch-baseline and PR-diff analysis; neither replaces the other.
  group: security-quality-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'pull_request' && 'pr' || 'branch' }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r security/requirements-ci.txt
      - name: Test report privacy and failure propagation
        run: python3 -m unittest discover -s security/tests -p 'test_*.py'
      - name: Test local security rules
        env:
          SEMGREP_IMAGE: docker.io/semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
        run: |
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e XDG_CONFIG_HOME=/tmp -e XDG_CACHE_HOME=/tmp \
            -e SEMGREP_SEND_METRICS=off -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE" \
            semgrep --test --config security/rules security/tests --metrics off --disable-version-check
      - name: Scan with Semgrep 1.185.0
        id: scan
        env:
          SEMGREP_IMAGE: docker.io/semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -e XDG_CONFIG_HOME=/tmp -e XDG_CACHE_HOME=/tmp \
            -e SEMGREP_SEND_METRICS=off -e SEMGREP_ENABLE_VERSION_CHECK=0 \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/security:/reports" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config security/rules --metrics off --disable-version-check \
            --strict --error --quiet --json --output /reports/semgrep.raw.json .
      - name: Classify and enforce Semgrep findings
        if: always() && steps.scan.outcome != 'skipped'
        run: >-
          python3 scripts/security/report.py semgrep
          --check
          < "$RUNNER_TEMP/security/semgrep.raw.json"
          > "$RUNNER_TEMP/security/semgrep.summary.json"
          --require-target app/src/main.tsx
          --require-target clinical/scripts/clinical_note_api.py
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/semgrep.summary.json
          if-no-files-found: error
          retention-days: 7

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Scan with Trivy 0.76.2
        id: scan
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p "$RUNNER_TEMP/security" "$RUNNER_TEMP/trivy-cache"
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/security:/reports" \
            -v "$RUNNER_TEMP/trivy-cache:/cache" -w /src "$TRIVY_IMAGE" \
            fs --config security/trivy.yaml --scanners vuln,secret,misconfig \
            --disable-telemetry --skip-version-check --ignore-unfixed=false --include-dev-deps \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --cache-dir /cache --format json --output /reports/trivy.raw.json --exit-code 0 --timeout 12m .
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/trivy-cache:/cache:ro" "$TRIVY_IMAGE" \
            --cache-dir /cache version --format json > "$RUNNER_TEMP/security/trivy.version.json"
      - name: Classify and enforce Trivy findings
        if: always() && steps.scan.outcome != 'skipped'
        # Scan all severities for visibility; block HIGH/CRITICAL and every secret.
        run: >-
          python3 scripts/security/report.py trivy
          --check
          < "$RUNNER_TEMP/security/trivy.raw.json"
          > "$RUNNER_TEMP/security/trivy.summary.json"
          --require-target app/package-lock.json
          --require-target clinical/requirements.txt
          --require-target clinical/requirements-test.txt
          --require-target security/requirements-ci.txt
          --require-target security/requirements-ptbxl-ci.txt
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security/trivy.summary.json
            ${{ runner.temp }}/security/trivy.version.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: real-test-coverage
    env:
      EMERGENCY_REQUIRE_BENCHMARK_TESTS: "1"
      EMERGENCY_REQUIRE_TLS_TESTS: "1"
      BG_OCR_MODEL: ${{ github.workspace }}/tools/blood-gas-ocr/models/eng.traineddata
      BG_TEST_FONT: ${{ github.workspace }}/clinical/assets/fonts/DejaVuSans.ttf
      NODE_PATH: ${{ github.workspace }}/tools/blood-gas-ocr/node_modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r security/requirements-ci.txt -r security/requirements-blood-gas-ci.txt -r security/requirements-ptbxl-ci.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix app
          npm run security:picomatch:apply --prefix app
          npm run security:picomatch:check --prefix app
          npm run security:picomatch:test --prefix app
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/blood-gas-ocr
          python scripts/prepare_blood_gas_model.py
      - name: Prepare native FFmpeg for synthetic video coverage
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run Python tests with measured coverage
        run: |
          python -m coverage run clinical/qa/qa_runner.py
          python -m coverage run -m unittest discover -s security/tests -p 'test_*.py'
          python -m coverage combine
          python -m coverage xml
          python - <<'PY'
          import coverage
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          shutil.copyfile('.coverage', '.coverage.portable')
          directory = Path('.local-review/coverage/portable')
          directory.mkdir(parents=True, exist_ok=True)
          git = lambda arg: subprocess.check_output(['git', 'rev-parse', arg], text=True).strip()
          metadata = {
              'commit': git('HEAD'), 'tree': git('HEAD^{tree}'), 'module': 'portable',
              'coverage_version': coverage.__version__,
              'config_sha256': hashlib.sha256(Path('.coveragerc').read_text(encoding='utf8').encode('utf8')).hexdigest(),
              'data_files': ['.coverage.portable'],
          }
          (directory / 'manifest.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf8')
          PY
      - name: Run frontend tests with measured coverage
        working-directory: app
        run: |
          npm run test:coverage
          python -c "from pathlib import Path; import re; p=Path('coverage/lcov.info'); p.write_text(re.sub(r'^SF:(.*)$', lambda m: 'SF:'+m[1].replace(chr(92), '/'), p.read_text(encoding='utf-8'), flags=re.M), encoding='utf-8')"
      - name: Measure real mitigation subprocess coverage
        working-directory: app
        run: node scripts/check-picomatch-coverage.mjs --run
      - name: Publish coverage only after tests pass
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            .coverage.portable
            .local-review/coverage/portable/manifest.json
            app/coverage/lcov.info
            app/coverage/picomatch-measured/measured-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-review:
    name: Native local review with measured Python coverage
    uses: ./.github/workflows/local-review-qa.yml
    permissions:
      contents: read

  sonarqube:
    needs: [coverage, native-review]
    name: sonarqube
    # Both measured test paths are required; a Trivy finding must not cancel Sonar analysis.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Determine whether secrets may be used
        id: trust
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if { [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; } \
            || [ "$ACTOR" = 'dependabot[bot]' ] || [ "$TRIGGERING_ACTOR" = 'dependabot[bot]' ]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Sonar analysis OMITTED: fork or Dependabot event; no secret supplied.'
            echo '### SonarQube: OMITTED (untrusted PR or Dependabot); no analysis or quality gate result.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require configured Sonar credential
        if: steps.trust.outputs.eligible == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Sonar CONFIGURATION_ERROR: repository Actions secret SONAR_TOKEN is missing.'
            echo '### SonarQube: CONFIGURATION_ERROR; SONAR_TOKEN missing. Scan and quality gate NOT EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Checkout complete history
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download measured test coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Set up Python for combining measured coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download measured Windows coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-python-coverage-t05-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-review/coverage-input/t05
      - name: Download measured Linux coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-python-coverage-t06-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-review/coverage-input/t06
      - name: Verify identities and combine actual Python measurements
        if: steps.trust.outputs.eligible == 'true'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r security/requirements-ci.txt
          python - <<'PY'
          import coverage
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          git = lambda arg: subprocess.check_output(['git', 'rev-parse', arg], text=True).strip()
          expected = (git('HEAD'), git('HEAD^{tree}'), coverage.__version__, hashlib.sha256(Path('.coveragerc').read_text(encoding='utf8').encode('utf8')).hexdigest())
          locations = {
              'portable': Path('.local-review/coverage/portable'),
              't05': Path('.local-review/coverage-input/t05'),
              't06': Path('.local-review/coverage-input/t06'),
          }
          for module, directory in locations.items():
              metadata = json.loads((directory / 'manifest.json').read_text(encoding='utf8'))
              observed = (metadata['commit'], metadata['tree'], metadata['coverage_version'], metadata['config_sha256'])
              if metadata['module'] != module or observed != expected:
                  raise SystemExit('Measured coverage identity mismatch: ' + module)
              data_directory = Path('.') if module == 'portable' else directory
              names = metadata['data_files']
              if not names or any(Path(name).name != name or not name.startswith('.coverage.') for name in names):
                  raise SystemExit('Invalid measured coverage manifest: ' + module)
              if any(not (data_directory / name).is_file() or not (data_directory / name).stat().st_size for name in names):
                  raise SystemExit('Missing measured coverage data: ' + module)
          PY
          python -m coverage combine --keep .coverage.portable .local-review/coverage-input/t05 .local-review/coverage-input/t06
          python -m coverage xml
      - name: Publish combined measured coverage
        if: steps.trust.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Scan and wait for quality gate
        id: sonar
        if: steps.trust.outputs.eligible == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.scanner.autoconfig.enabled=false
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Record observed scan outcome
        if: always() && steps.trust.outputs.eligible == 'true'
        env:
          SCAN_OUTCOME: ${{ steps.sonar.outcome }}
        run: |
          {
            echo '### SonarQube Cloud'
            echo "Scanner step outcome: **$SCAN_OUTCOME**."
            echo 'A failed step may indicate configuration, plan limits, scanner errors or a failed quality gate; inspect its logs.'
            echo 'A skipped scan is NOT EXECUTED. Technical analysis does not change CLINICALLY_PENDING.'
            echo 'https://sonarcloud.io/dashboard?id=JuanCopado_Emergency'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect metadata for a failed quality gate
        id: sonar_diagnostics
        if: always() && steps.trust.outputs.eligible == 'true' && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number || '' }}
        run: python scripts/security/sonar_diagnostics.py > "$RUNNER_TEMP/sonar-diagnostics.json"
      - name: Publish quality gate diagnostic metadata
        if: always() && (steps.sonar_diagnostics.outcome == 'success' || steps.sonar_diagnostics.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-diagnostics.json
          if-no-files-found: error
          retention-days: 7
