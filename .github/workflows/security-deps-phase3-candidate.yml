name: Phase 3 isolated transitive dependency hardening

# TEMPORARY candidate runner. Remove after publishing tested lockfile.
on:
  push:
    branches:
      - codex/security-deps-phase3-20261117
    paths:
      - .github/workflows/security-deps-phase3-candidate.yml

permissions:
  contents: read

jobs:
  resolve-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies for build and lock resolution
        run: |
          python -m pip install -r clinical/requirements-test.txt
          npm install --global npm@11.21.2 --no-audit --no-fund
      - name: Apply compatible transitive dependency updates
        run: |
          set -euo pipefail
          cd app
          npm ci --no-audit --no-fund
          npm update undici source-map-js fast-uri postcss-selector-parser serialize-javascript --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund
          node <<'NODE'
          const {readFileSync}=require('node:fs');
          const lock=JSON.parse(readFileSync('package-lock.json'));
          const min={undici:'8.12.2','source-map-js':'1.2.2','fast-uri':'3.1.9','postcss-selector-parser':'6.1.5','serialize-javascript':'7.1.3'};
          const lex=(s)=>s.split('.').map(n=>Number(n));
          const atLeast=(s,m)=>{const a=lex(s),b=lex(m);for(let i=0;i<3;i++){if(a[i]>b[i])return true;if(a[i]<b[i])return false}return true};
          for(const [pkg,threshold] of Object.entries(min)){
            const rows=Object.entries(lock.packages).filter(([path,v])=>path.endsWith('/node_modules/'+pkg) || path==='node_modules/'+pkg);
            for(const [path,p]of rows){if(!atLeast(p.version,threshold)){throw Error('Vulnerable transitive dependency still installed: '+path+'@'+p.version+' (< '+threshold+')')}}
            console.log(pkg+': '+(rows.length?rows.map(([p,v])=>v.version).join(', '):'not installed'));
          }
          NODE
      - name: Validate canonical artifacts
        run: |
          set -euo pipefail
          cd app
          npm run guides:test
          npm run procedures:test
          npm run pediatrics:check
      - name: Lint, typecheck, full frontend suite
        run: |
          set -euo pipefail
          cd app
          npm run lint
          npm run typecheck
          npm test
      - name: Build and ensure no canonical catalog drift
        run: |
          set -euo pipefail
          cd app
          npm run build
          git diff --exit-code -- src/data/generatedClinicalGuides.json src/data/generatedProcedures.json src/data/generatedPediatricOutpatient.json
      - name: Commit only package lock when all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/security-deps-phase3-20261117'
          test "$GITHUB_REPOSITORY" = 'JuanCopado/Emergency'
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^app/(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then echo 'Unexpected changes; refusing publication'; exit 1; fi
          git add app/package.json app/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No dependency changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): refresh vulnerable compatible transitive dependencies'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/security-deps-phase3-20261117
