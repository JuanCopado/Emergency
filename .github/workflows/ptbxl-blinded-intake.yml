name: PTB-XL Blinded ECG Intake

on:
  push:
    branches:
      - v1.36-consolidation
    paths:
      - '.github/ptbxl-intake-trigger'
  workflow_dispatch:
    inputs:
      target_code:
        description: 'PTB-XL SCP-ECG target code'
        required: true
        default: 'AFIB'
      max_cases:
        description: '0 = all fold-10 cases'
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  build-blinded-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip wfdb matplotlib numpy

      - name: Download PTB-XL metadata v1.0.3
        run: |
          mkdir -p .ptbxl-input
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 60             "https://physionet-open.s3.amazonaws.com/ptb-xl/1.0.3/ptbxl_database.csv"             --output .ptbxl-input/ptbxl_database.csv           || curl --fail --location --retry 2 --connect-timeout 20 --max-time 90             "https://physionet.org/files/ptb-xl/1.0.3/ptbxl_database.csv"             --output .ptbxl-input/ptbxl_database.csv

      - name: Verify source intake gate
        working-directory: clinical
        run: python scripts/validate_image_dataset_source.py qa/image-dataset-source-registry.json --require-ready-source ptb-xl

      - name: Prepare blinded-run salt
        env:
          CONFIGURED_SALT: ${{ secrets.PTBXL_BLINDING_SALT }}
        run: |
          SALT="$CONFIGURED_SALT"
          if [ -z "$SALT" ]; then
            SALT="$(openssl rand -hex 32)"
            echo "Using ephemeral per-run blinding salt"
          else
            echo "Using configured repository blinding salt"
          fi
          echo "::add-mask::$SALT"
          echo "PTBXL_RUN_SALT=$SALT" >> "$GITHUB_ENV"

      - name: Select intake mode
        env:
          MANUAL_MAX_CASES: ${{ github.event.inputs.max_cases || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && grep -q "^FULL_FOLD$" .github/ptbxl-intake-trigger; then
            echo "PTBXL_PILOT_PER_CLASS=0" >> "$GITHUB_ENV"
            echo "PTBXL_NATURAL_LIMIT=0" >> "$GITHUB_ENV"
            echo "PTBXL_MAX_CASES=0" >> "$GITHUB_ENV"
            echo "PTBXL_INTAKE_MODE=full_fold" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] && grep -q "^NATURAL_250$" .github/ptbxl-intake-trigger; then
            echo "PTBXL_PILOT_PER_CLASS=0" >> "$GITHUB_ENV"
            echo "PTBXL_NATURAL_LIMIT=250" >> "$GITHUB_ENV"
            echo "PTBXL_MAX_CASES=0" >> "$GITHUB_ENV"
            echo "PTBXL_INTAKE_MODE=natural_250" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "PTBXL_PILOT_PER_CLASS=5" >> "$GITHUB_ENV"
            echo "PTBXL_NATURAL_LIMIT=0" >> "$GITHUB_ENV"
            echo "PTBXL_MAX_CASES=0" >> "$GITHUB_ENV"
            echo "PTBXL_INTAKE_MODE=balanced_pipeline_pilot" >> "$GITHUB_ENV"
          else
            echo "PTBXL_PILOT_PER_CLASS=0" >> "$GITHUB_ENV"
            echo "PTBXL_NATURAL_LIMIT=0" >> "$GITHUB_ENV"
            echo "PTBXL_MAX_CASES=$MANUAL_MAX_CASES" >> "$GITHUB_ENV"
            echo "PTBXL_INTAKE_MODE=manual" >> "$GITHUB_ENV"
          fi

      - name: Build blinded fold-10 ECG benchmark
        env:
          TARGET_CODE: ${{ github.event.inputs.target_code || 'AFIB' }}
        run: |
          echo "Intake mode: $PTBXL_INTAKE_MODE"
          python clinical/scripts/build_ptbxl_blinded_benchmark.py             .ptbxl-input/ptbxl_database.csv             "$TARGET_CODE"             .ptbxl-output             --salt "$PTBXL_RUN_SALT"             --fold 10             --max-cases "$PTBXL_MAX_CASES"             --pilot-per-class "$PTBXL_PILOT_PER_CLASS"             --natural-limit "$PTBXL_NATURAL_LIMIT"

      - name: Build blinded evaluation shards and prediction templates
        run: |
          mkdir -p .ptbxl-output/shards .ptbxl-output/prediction-templates
          python clinical/scripts/shard_blinded_image_manifest.py             .ptbxl-output/blinded_manifest.json             .ptbxl-output/shards             --max-cases 50
          for shard in .ptbxl-output/shards/shard-*.json; do
            base="$(basename "$shard" .json)"
            python clinical/scripts/create_blinded_prediction_template.py               "$shard"               ".ptbxl-output/prediction-templates/${base}-predictions.json"
          done

      - name: Ensure sealed reference is absent from blinded artifact directory
        run: |
          mkdir -p ptbxl-blinded-artifact ptbxl-sealed-artifact
          cp .ptbxl-output/blinded_manifest.json ptbxl-blinded-artifact/
          cp -r .ptbxl-output/images ptbxl-blinded-artifact/
          cp -r .ptbxl-output/shards ptbxl-blinded-artifact/
          cp -r .ptbxl-output/prediction-templates ptbxl-blinded-artifact/
          cp .ptbxl-output/SEALED_REFERENCE_DO_NOT_REVEAL.json ptbxl-sealed-artifact/
          test ! -e ptbxl-blinded-artifact/SEALED_REFERENCE_DO_NOT_REVEAL.json
          ! grep -R -E '"target_positive"|"source_ecg_id"|"source_patient_id"' ptbxl-blinded-artifact/

      - name: Upload blinded image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptbxl-blinded-${{ github.event.inputs.target_code || 'AFIB' }}-fold10
          path: ptbxl-blinded-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Upload sealed reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptbxl-sealed-reference-${{ github.event.inputs.target_code || 'AFIB' }}-fold10
          path: ptbxl-sealed-artifact/
          retention-days: 14
          if-no-files-found: error
