name: R77 native Windows browser QA

on:
  push:
    branches: [codex/r77-windows-browser-qa-20261124]
    paths: [.github/workflows/r77-native-browser-qa.yml]

permissions:
  contents: read

jobs:
  native-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 809236fbe147e54ea1b0b20045faf3a74c9bfc12
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies and build
        env:
          EMERGENCY_SECURITY_AUDIT: '1'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r ../security/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run postinstall --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:security
      - name: Run canonical route QA using the installed Windows browser
        env:
          R77_BROWSER: ${{ matrix.browser }}
        run: |
          $relative = if ($env:R77_BROWSER -eq 'edge') {
            'Microsoft\Edge\Application\msedge.exe'
          } else {
            'Google\Chrome\Application\chrome.exe'
          }
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA")
          $executable = $roots | ForEach-Object { Join-Path $_ $relative } |
            Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $executable) { throw "Native browser executable missing: $env:R77_BROWSER" }
          $env:CHROMIUM_PATH = $executable
          $env:ROUTE_QA_OUTPUT = Join-Path $env:RUNNER_TEMP "r77-navigation-$env:R77_BROWSER.json"
          $worktree = @(git status --porcelain)
          $worktree | Write-Output
          git diff --exit-code --ignore-space-at-eol HEAD
          if ($LASTEXITCODE -ne 0) { throw "Build changed tracked content beyond line endings" }
          $browserEvidence = @{
            worktree = $worktree
            platform = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            browser = $env:R77_BROWSER
            executable = $executable
            fileVersion = (Get-Item $executable).VersionInfo.ProductVersion
            commit = (git rev-parse HEAD)
          }
          $browserEvidence | ConvertTo-Json | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "r77-browser-$env:R77_BROWSER.json")
          node scripts/check-route-navigation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r77-native-${{ matrix.browser }}
          path: ${{ runner.temp }}/r77-*.json
          if-no-files-found: warn
