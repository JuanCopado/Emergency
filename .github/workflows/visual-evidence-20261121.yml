name: Emergency visual evidence
on:
  push:
    branches: ['diagnostic/visual-pr51-20261121']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r ../security/requirements-ci.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run postinstall --ignore-scripts && npm run build
      - run: node scripts/visual-evidence-20261121.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Preserve synthetic screenshots as a portable review copy
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json
          from PIL import Image
          import io
          import hashlib
          for p in sorted(Path('review-shots').glob('*.png')):
              img=Image.open(p).convert('RGB')
              img.thumbnail((950,750))
              out=io.BytesIO()
              img.save(out, format='JPEG', quality=65, optimize=True)
              raw=out.getvalue()
              enc=base64.b64encode(raw).decode('ascii')
              for i in range(0,len(enc),3000):
                  print('EMERGENCY_SHOT',p.stem,i,enc[i:i+3000])
              print('EMERGENCY_HASH',p.stem,hashlib.sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emergency-visual-8179853e
          path: app/review-shots/
          if-no-files-found: error
          retention-days: 14
