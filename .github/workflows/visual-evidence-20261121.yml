name: Emergency visual evidence
on:
  push:
    branches: ['diagnostic/visual-pr51-20261121']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: --require-hashes -r ../security/requirements-ci.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run postinstall --ignore-scripts && npm run build
      - run: node scripts/visual-evidence-20261121.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: emergency-visual-8179853e
          path: app/review-shots/
          if-no-files-found: error
          retention-days: 14
