name: Clinical QA

on:
  push:
    branches: [main, 'v1.*', 'codex/**']
    paths:
      - 'clinical/**'
      - 'docs/**'
      - 'knowledge-graph/**'
      - 'rag/**'
      - 'models/**'
      - '.graphifyignore'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'STATE.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'clinical/**'
      - 'docs/**'
      - 'knowledge-graph/**'
      - 'rag/**'
      - 'models/**'
      - '.graphifyignore'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'STATE.md'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: clinical-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BG_OCR_MODEL: ${{ github.workspace }}/tools/blood-gas-ocr/models/eng.traineddata
      BG_TEST_FONT: ${{ github.workspace }}/clinical/assets/fonts/DejaVuSans.ttf
      NODE_PATH: ${{ github.workspace }}/tools/blood-gas-ocr/node_modules
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            clinical/requirements.txt
            clinical/requirements-test.txt
      - name: Install clinical runtime and test requirements
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r security/requirements-ci.txt -r security/requirements-blood-gas-ci.txt
      - name: Set up Node for the local OCR regressions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare the verified local OCR runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/blood-gas-ocr
          python scripts/prepare_blood_gas_model.py
      - name: Verify normalized evidence source catalog
        run: python3 clinical/scripts/normalize_evidence_sources.py --check
      - name: Build deterministic provenance graph
        run: python3 clinical/scripts/build_project_graph.py --output /tmp/project-graph.json
      - name: Run unified clinical QA
        working-directory: clinical
        run: python3 qa/qa_runner.py
