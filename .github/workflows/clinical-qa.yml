name: Clinical QA

on:
  push:
    branches: [main, 'v1.*']
    paths:
      - 'clinical/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'clinical/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: clinical-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            clinical/requirements.txt
            clinical/requirements-test.txt
      - name: Install clinical runtime and test requirements
        run: python -m pip install -r clinical/requirements-test.txt
      - name: Run unified clinical QA
        working-directory: clinical
        run: python3 qa/qa_runner.py
