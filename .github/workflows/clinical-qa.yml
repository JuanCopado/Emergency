name: Clinical QA

on:
  push:
    branches: [main, 'v1.*', 'codex/**']
    paths:
      - 'clinical/**'
      - 'docs/**'
      - 'knowledge-graph/**'
      - 'rag/**'
      - 'models/**'
      - '.graphifyignore'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'STATE.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'clinical/**'
      - 'docs/**'
      - 'knowledge-graph/**'
      - 'rag/**'
      - 'models/**'
      - '.graphifyignore'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'STATE.md'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: clinical-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            clinical/requirements.txt
            clinical/requirements-test.txt
      - name: Install clinical runtime and test requirements
        run: python -m pip install -r clinical/requirements-test.txt
      - name: Verify normalized evidence source catalog
        run: python3 clinical/scripts/normalize_evidence_sources.py --check
      - name: Build deterministic provenance graph
        run: python3 clinical/scripts/build_project_graph.py --output /tmp/project-graph.json
      - name: Run unified clinical QA
        working-directory: clinical
        run: python3 qa/qa_runner.py
