name: Phase 2 isolated dependency upgrade candidate

# TEMPORARY: only this isolated task branch; remove after producing the audited lockfile.
on:
  push:
    branches:
      - codex/security-deps-phase2-20261117
    paths:
      - .github/workflows/security-deps-upgrade-candidate.yml
      - app/vite.config.ts

permissions:
  contents: read

jobs:
  upgrade-verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout isolated branch without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up Python for canonical frontend build
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install clinical build/test dependencies
        run: python -m pip install -r clinical/requirements-test.txt
      - name: Install npm 11.21.2 for peer resolution (Arborist bug in npm 10)
        run: |
          npm install --global npm@11.21.2 --no-audit --no-fund
          npm --version
      - name: Resolve and verify security update
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npm install --save-dev --save-exact vite@6.4.6 vitest@4.1.12 --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund
          npm ls vite vitest tinypool @vitest/mocker --all
          node <<'NODE'
          const {readFileSync}=require('node:fs');
          const lock=JSON.parse(readFileSync('package-lock.json'));
          const pkg=JSON.parse(readFileSync('package.json'));
          const version=(name)=>lock.packages['node_modules/'+name]?.version;
          if(pkg.devDependencies.vite!=='6.4.6'||pkg.devDependencies.vitest!=='4.1.12'){
            throw Error('Requested direct versions not exact');
          }
          if(version('vite')!=='6.4.6'||version('vitest')!=='4.1.12'){
            throw Error('Direct lockfile versions not exact');
          }
          if(version('@vitest/mocker')!=='4.1.12'){
            throw Error('Vitest mocker not updated');
          }
          const pool=version('tinypool');
          if(pool && (Number(pool.split('.')[0])<2 || (pool.startsWith('2.1.') && Number(pool.split('.')[2])<2))){
            throw Error('Vulnerable tinypool remains: '+pool);
          }
          console.log('Pinned security updates:',JSON.stringify({vite:version('vite'),vitest:version('vitest'),mocker:version('@vitest/mocker'),tinypool:pool??'not installed'}));
          NODE
      - name: Canonical artifact checks
        run: |
          set -euo pipefail
          cd app
          npm run guides:test
          npm run procedures:test
          npm run pediatrics:check
      - name: Lint, typecheck and frontend tests
        run: |
          set -euo pipefail
          cd app
          npm run lint
          npm run typecheck
          npm test
      - name: Build and verify no canonical catalog drift
        run: |
          set -euo pipefail
          cd app
          npm run build
          git diff --exit-code -- src/data/generatedClinicalGuides.json src/data/generatedProcedures.json src/data/generatedPediatricOutpatient.json
      - name: Commit only the two dependency manifests to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/security-deps-phase2-20261117'
          test "$GITHUB_REPOSITORY" = 'JuanCopado/Emergency'
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^app/(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then echo 'Refusing unexpected working-tree changes'; exit 1; fi
          git add app/package.json app/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No dependency changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): update Vite and Vitest with tested lockfile'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/security-deps-phase2-20261117
