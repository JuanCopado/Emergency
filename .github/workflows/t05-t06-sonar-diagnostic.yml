name: T05 T06 Sonar diagnostic metadata

on:
  push:
    branches: ['codex/integrate-t05-t06-20261119']
    paths: ['scripts/security/sonar_diagnostics.py', '.github/workflows/t05-t06-sonar-diagnostic.yml']

permissions:
  contents: read

jobs:
  metadata:
    # Temporary task diagnostic: the last completed analysis, never a release gate.
    if: github.repository == 'JuanCopado/Emergency' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout the diagnostic
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Inspect metadata of the last completed PR analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: '33'
        run: python3 scripts/security/sonar_diagnostics.py > "$RUNNER_TEMP/sonar-metadata.json"
      - name: Preserve diagnostic outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-metadata-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-metadata.json
          if-no-files-found: error
          retention-days: 7
