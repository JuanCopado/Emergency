name: App UI QA

on:
  push:
    branches: [main, 'v1.*', 'codex/**']
    paths:
      - 'app/**'
      - 'clinical/modules/**'
      - 'clinical/references/module-index.md'
      - 'clinical/references/evidence-registry.json'
      - 'clinical/references/acute-*.md'
      - 'clinical/references/acute-*.json'
      - 'clinical/MODULES.md'
      - 'clinical/scripts/**'
      - 'clinical/calculators/**'
      - 'clinical/data/**'
      - 'clinical/schemas/**'
      - 'clinical/templates/**'
      - 'clinical/assets/fonts/**'
      - 'clinical/requirements*.txt'
      - 'clinical/qa/pediatric-outpatient-medications.json'
      - 'clinical/qa/pediatric-outpatient-alert-rules.json'
      - 'clinical/qa/V1.44_ACUTE_MEDICATION_CASES.json'
      - '.github/workflows/app-ui-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'clinical/modules/**'
      - 'clinical/references/module-index.md'
      - 'clinical/references/evidence-registry.json'
      - 'clinical/references/acute-*.md'
      - 'clinical/references/acute-*.json'
      - 'clinical/MODULES.md'
      - 'clinical/scripts/**'
      - 'clinical/calculators/**'
      - 'clinical/data/**'
      - 'clinical/schemas/**'
      - 'clinical/templates/**'
      - 'clinical/assets/fonts/**'
      - 'clinical/requirements*.txt'
      - 'clinical/qa/pediatric-outpatient-medications.json'
      - 'clinical/qa/pediatric-outpatient-alert-rules.json'
      - 'clinical/qa/V1.44_ACUTE_MEDICATION_CASES.json'
      - '.github/workflows/app-ui-qa.yml'
  workflow_dispatch:

concurrency:
  group: app-ui-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up Python for browser PDF verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            clinical/requirements.txt
            clinical/requirements-test.txt
      - name: Install clinical runtime and test requirements
        run: python -m pip install -r ../clinical/requirements-test.txt
      - name: Install
        run: npm ci
      - name: Verify temporary picomatch guard
        run: |
          npm run security:picomatch:check
          npm run security:picomatch:test
      - name: Check committed canonical artifacts
        run: |
          npm run guides:test
          npm run procedures:test
          npm run pediatrics:check
      - name: Lint
        run: npm run lint
      - name: Evidence writer regression
        run: node --test scripts/write-qa-evidence.node-test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Ensure build did not change committed catalogs
        run: git diff --exit-code -- src/data/generatedClinicalGuides.json src/data/generatedProcedures.json src/data/generatedPediatricOutpatient.json
      - name: Verify reviewed acute contracts in Chromium
        id: reviewed_acute
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          rm -f ../clinical/qa/REVIEWED_ACUTE_BROWSER_2026-11-16.json
          node scripts/check-reviewed-acute-contracts.mjs
      - name: Upload reviewed acute browser evidence from this run
        if: always() && (steps.reviewed_acute.outcome == 'success' || steps.reviewed_acute.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-acute-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: clinical/qa/REVIEWED_ACUTE_BROWSER_2026-11-16.json
          if-no-files-found: error
      - name: Verify actual browser PDF fidelity
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run guides:print-check
      - name: Verify pediatric form against canonical backend
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run pediatrics:browser-check
