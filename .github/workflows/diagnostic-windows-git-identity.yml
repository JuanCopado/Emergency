name: Diagnostic windows git identity (throwaway)
on:
  push:
    branches: ['diagnostic/windows-git-identity-*']
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reproduce readBuildIdentity's Git call
        shell: bash
        run: node diag/windows-git-identity.mjs
