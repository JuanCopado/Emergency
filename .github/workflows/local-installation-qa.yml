name: Local Installation QA

on:
  push:
    branches: ['feat/implementation-local-package-*']
    paths:
      - 'tools/local-installation/**'
      - '.github/workflows/local-installation-qa.yml'
  pull_request:
    paths:
      - 'tools/local-installation/**'
      - '.github/workflows/local-installation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-installation:
    name: local-installation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # repository-pinned v4.4.0
      - name: Python standard library only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # repository-pinned v5.6.0
        with:
          python-version: '3.12'
      - name: Package, activation, rollback and actual HTTP negative controls
        run: python -m unittest discover -s tools/local-installation -p "test_*.py" -v
