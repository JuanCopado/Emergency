name: Dermatology asset admission

on:
  pull_request:
  push:
    branches: [main, master, 'codex/**', 'v1.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # existing project pin
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # existing project pin
        with:
          node-version: '22'
      - name: Verify media admission and purpose boundaries
        working-directory: app
        run: |
          npm run dermatology:gate
          npm run dermatology:gate:test
