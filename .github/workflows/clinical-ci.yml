name: Clinical CI

on:
  pull_request:
    paths:
      - "clinical/**"
      - "knowledge-graph/**"
      - "rag/**"
      - "models/**"
      - "docs/**"
      - ".graphifyignore"
      - ".gitignore"
      - "CLAUDE.md"
      - "STATE.md"
      - ".github/workflows/clinical-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "clinical/**"
      - "knowledge-graph/**"
      - "rag/**"
      - "models/**"
      - "docs/**"
      - ".graphifyignore"
      - ".gitignore"
      - "CLAUDE.md"
      - "STATE.md"
      - ".github/workflows/clinical-ci.yml"

permissions:
  contents: read

jobs:
  clinical-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate module manifest and router
        working-directory: clinical
        run: python3 scripts/validate_modules.py
      - name: Audit evidence coverage and review windows
        working-directory: clinical
        run: python3 scripts/audit_evidence_coverage.py
      - name: Unit and regression tests
        working-directory: clinical
        run: python3 -m unittest discover -s tests -q
      - name: Build deterministic knowledge graph
        run: python3 clinical/scripts/build_project_graph.py --output /tmp/project-graph.json
