name: Read integration Sonar findings
on:
  push:
    branches: ['diagnostic/sonar-pr33-findings-20261120']
    paths: ['.github/workflows/read-pr33-sonar.yml']
permissions: {}
jobs:
  findings:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check the analysed revision and count all open findings
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/v144-international-scope-20261116'
          curl --fail --silent --show-error --get https://sonarcloud.io/api/project_analyses/search \
            --data-urlencode 'project=JuanCopado_Emergency' --data-urlencode "branch=$branch" --data-urlencode 'ps=1' \
            | jq -ce '{analysis: (.analyses[0] | {key,date,revision})}'
          curl --fail --silent --show-error --get https://sonarcloud.io/api/issues/search \
            --data-urlencode 'organization=juancopado' --data-urlencode 'componentKeys=JuanCopado_Emergency' \
            --data-urlencode "branch=$branch" --data-urlencode 'resolved=false' --data-urlencode 'ps=100' \
            | jq -ce '{total, issues: [.issues[] | {rule,severity,component,line,message}]}'
