name: Dependency remediation preparation
on:
  push:
    branches: [codex/security-remediation-20261118]
    paths: [.github/workflows/dependency-remediation-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Resolve patched dependencies without install scripts
        working-directory: app
        run: |
          node --version
          npm --version
          npm view vite@6.4.4 version engines --json
          npm view vitest@4.1.12 version engines dependencies peerDependencies --json
          npm view undici@8.12.2 version engines --json
          npm view source-map-js@1.2.2 version --json
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit --save-dev --save-exact vite@6.4.4 vitest@4.1.12
          npm update --package-lock-only --ignore-scripts --no-fund --no-audit source-map-js undici tinypool
      - name: Export generated manifests
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          for name in ('app/package.json', 'app/package-lock.json'):
              raw = Path(name).read_bytes()
              print('MANIFEST ' + name + ' ' + hashlib.sha256(raw).hexdigest() + ' ' + base64.b64encode(zlib.compress(raw, 9)).decode())
          PY
