name: Temporary Vitest coverage bootstrap (isolated)

# This workflow is removed after the pinned dependency is committed.
on:
  push:
    branches:
      - codex/security-sonar-coverage-20261117
    paths:
      - .github/workflows/security-coverage-bootstrap.yml

permissions:
  contents: read

jobs:
  coverage-dependency-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout isolated branch without persistent credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Python 3.12 for build metadata
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve pinned Vitest coverage provider
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r clinical/requirements-test.txt
          npm install --global npm@11.21.2 --no-audit --no-fund
          cd app
          npm ci --no-audit --no-fund
          npm install --save-dev --save-exact @vitest/coverage-v8@4.1.12 --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund
          node <<'NODE'
          const {readFileSync}=require('node:fs');
          const p=JSON.parse(readFileSync('package.json'));
          const lock=JSON.parse(readFileSync('package-lock.json'));
          if(p.devDependencies['@vitest/coverage-v8']!=='4.1.12')throw Error('Unpinned coverage provider');
          if(lock.packages['node_modules/@vitest/coverage-v8']?.version!=='4.1.12')throw Error('Coverage lock mismatch');
          if(lock.packages['node_modules/vitest']?.version!=='4.1.12')throw Error('Vitest changed unexpectedly');
          console.log('Verified pinned Vitest V8 coverage provider 4.1.12');
          NODE
      - name: Run real, untrimmed frontend coverage
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npm run typecheck
          npm test -- --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary \
            --coverage.include='src/**/*.{ts,tsx,js,jsx}' \
            --coverage.include='scripts/**/*.{ts,tsx,js,mjs,cjs}' \
            --coverage.exclude='src/test/**' \
            --coverage.exclude='**/*.test.{ts,tsx,js,jsx}' \
            --coverage.exclude='**/*.node-test.mjs'
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
          python - <<'PY'
          from pathlib import Path
          data=Path('coverage/lcov.info').read_text()
          files=[line for line in data.splitlines() if line.startswith('SF:')]
          print('Real LCOV source files:',len(files))
          if not files:
              raise SystemExit('Empty LCOV despite successful tests')
          if any('node_modules/' in item for item in files):
              raise SystemExit('Unexpected node_modules entry in coverage')
          PY
      - name: Commit only manifest and lockfile, after verified coverage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/security-sonar-coverage-20261117'
          test "$GITHUB_REPOSITORY" = 'JuanCopado/Emergency'
          other="$(git diff --name-only | grep -Ev '^app/(package.json|package-lock.json)$' || true)"
          if [ -n "$other" ]; then echo "Unexpected tracked change: $other"; exit 1; fi
          git add app/package.json app/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No manifest changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(security): pin Vitest V8 coverage provider 4.1.12'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/security-sonar-coverage-20261117
