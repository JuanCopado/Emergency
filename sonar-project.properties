# Keys copied from this project's authenticated GitHub Actions onboarding page.
sonar.projectKey=JuanCopado_Emergency
sonar.organization=juancopado
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Preserve explicit classification instead of scanner automatic configuration.
sonar.scanner.autoconfig.enabled=false
sonar.sources=app,clinical/scripts,clinical/qa,clinical/agents,scripts,.github,security,tools/interop-local
sonar.inclusions=**/*.py,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.html,**/*.css,**/*.yml,**/*.yaml
sonar.tests=app,clinical/tests,security/tests,tools/interop-local
sonar.test.inclusions=app/**/*.test.ts,app/**/*.test.tsx,app/scripts/dermatology-asset-admission.test.mjs,app/**/*.node-test.mjs,app/src/test/**,app/scripts/check-*.mjs,clinical/tests/**/*.py,security/tests/**,tools/interop-local/test_*.py

# Dependencies, builds, caches, backups and generated data are not source code.
# Test paths are excluded from main code and included above as test code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.scannerwork/**,**/backups/**,**/preservation/**,**/graphify-out/**,knowledge-graph/generated/**,app/src/data/generatedClinicalGuides.json,app/src/data/generatedProcedures.json,app/src/data/generatedPediatricOutpatient.json,app/**/*.test.ts,app/**/*.test.tsx,app/scripts/dermatology-asset-admission.test.mjs,app/**/*.node-test.mjs,app/src/test/**,app/scripts/check-*.mjs,clinical/tests/**,security/tests/**,tools/interop-local/test_*.py,**/*.zip,**/*.gpg,**/*.pgp,**/*.pdf,**/*.docx,**/*.dcm,**/*.dicom
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**

# Coverage is generated by real tests in the independent coverage job.
# No executable source is excluded from coverage to change the gate.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
