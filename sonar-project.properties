# Keys copied from this project's authenticated GitHub Actions onboarding page.
sonar.projectKey=JuanCopado_Emergency
sonar.organization=juancopado
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Preserve explicit classification instead of scanner automatic configuration.
sonar.scanner.autoconfig.enabled=false
sonar.sources=app,clinical/scripts,clinical/qa,clinical/agents,scripts,.github,security
sonar.inclusions=**/*.py,**/*.ts,**/*.tsx,**/*.js,**/*.jsx,**/*.mjs,**/*.cjs,**/*.html,**/*.css,**/*.yml,**/*.yaml
sonar.tests=app,clinical/tests,security/tests
sonar.test.inclusions=app/**/*.test.ts,app/**/*.test.tsx,app/**/*.node-test.mjs,app/src/test/**,app/scripts/check-*.mjs,clinical/tests/**/*.py,security/tests/**

# Dependencies, builds, caches, backups and generated data are not source code.
# Test paths are excluded from main code and included above as test code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.scannerwork/**,**/backups/**,**/preservation/**,**/graphify-out/**,knowledge-graph/generated/**,app/src/data/generatedClinicalGuides.json,app/src/data/generatedProcedures.json,app/src/data/generatedPediatricOutpatient.json,app/**/*.test.ts,app/**/*.test.tsx,app/**/*.node-test.mjs,app/src/test/**,app/scripts/check-*.mjs,clinical/tests/**,security/tests/**,**/*.zip,**/*.gpg,**/*.pgp,**/*.pdf,**/*.docx,**/*.dcm,**/*.dicom
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**

# No coverage report exists in this snapshot. Do not fabricate a coverage value
# or exclude executable code from coverage to make the quality gate pass.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
