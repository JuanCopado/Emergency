scan:
  scanners:
    - vuln
    - secret
    - misconfig
  file-patterns:
    - 'pip:requirements-.*\.txt'
  skip-dirs:
    - .git
    - node_modules
    - app/node_modules
    - app/dist
    - preservation
    - backups
    - graphify-out
    - knowledge-graph/generated
  skip-files:
    - '**/*.zip'
    - '**/*.gpg'
    - '**/*.pgp'
    - '**/*.dcm'
    - '**/*.dicom'
    - '**/*.pdf'
    - '**/*.docx'
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
vulnerability:
  ignore-unfixed: false
misconfiguration:
  include-non-failures: false
