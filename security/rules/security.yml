rules:
  - id: python-dynamic-eval
    languages: [python]
    severity: ERROR
    message: Review dynamic evaluation; prefer an explicit parser.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      category: security
      cwe: CWE-95
      confidence: HIGH
  - id: python-shell-execution
    languages: [python]
    severity: ERROR
    message: Review shell execution; pass an argument list with shell disabled.
    pattern-either:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
    metadata:
      category: security
      cwe: CWE-78
      confidence: HIGH
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Review deserialization of executable Python objects.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
    metadata:
      category: security
      cwe: CWE-502
      confidence: HIGH
  - id: python-unsafe-yaml
    languages: [python]
    severity: ERROR
    message: Use safe_load rather than a YAML loader capable of constructing objects.
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.BaseLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CBaseLoader, ...)
    metadata:
      category: security
      cwe: CWE-502
      confidence: HIGH
  - id: python-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: Preserve certificate verification on outgoing requests.
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
    metadata:
      category: security
      cwe: CWE-295
      confidence: HIGH
  - id: python-sql-interpolation
    languages: [python]
    severity: ERROR
    message: Review interpolated SQL; use parameter binding.
    pattern-either:
      - pattern: $CURSOR.execute(f"...")
      - pattern: $CURSOR.execute("..." % ...)
      - pattern: $CURSOR.execute("...".format(...))
    metadata:
      category: security
      cwe: CWE-89
      confidence: MEDIUM
  - id: javascript-dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Review dynamic JavaScript evaluation.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    metadata:
      category: security
      cwe: CWE-95
      confidence: HIGH
  - id: javascript-html-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Review raw HTML insertion and the trust boundary of the value.
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML($POSITION, $VALUE)
      - pattern: document.write(...)
      - pattern: "<$TAG ... dangerouslySetInnerHTML={$VALUE} ... />"
    metadata:
      category: security
      cwe: CWE-79
      confidence: MEDIUM
  - id: javascript-wildcard-postmessage
    languages: [javascript, typescript]
    severity: ERROR
    message: Use the intended recipient origin when messaging another window.
    pattern: $WINDOW.postMessage($MESSAGE, "*")
    metadata:
      category: security
      cwe: CWE-942
      confidence: HIGH
  - id: javascript-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: Preserve TLS certificate verification.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata:
      category: security
      cwe: CWE-295
      confidence: HIGH
  - id: javascript-shell-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Review shell command execution and prefer argument arrays.
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: 'child_process.spawn(..., { ..., shell: true, ... })'
    metadata:
      category: security
      cwe: CWE-78
      confidence: MEDIUM
  - id: javascript-insecure-random
    languages: [javascript, typescript]
    severity: WARNING
    message: Verify that Math.random is not used for security-sensitive identifiers.
    pattern: Math.random(...)
    metadata:
      category: security
      cwe: CWE-338
      confidence: LOW
